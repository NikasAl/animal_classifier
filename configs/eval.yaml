api:
  base_url: "https://apihub.agnes-ai.com/v1"
  api_key: "sk-FFcH2NmPRNJlSgAjweLB133XVMOKjXEwxhWV1Im5YkPlsQGd"
  model: "agnes-3.0-flash"
  timeout: 120

request:
  temperature: 0.0
  max_tokens: 900
  seed: 42
  max_image_side: 1024
  jpeg_quality: 85

run:
  species: dog
  modes: [closed, open, reasoning]
  concurrency: 4
  manifest: "manifests/dog_extended.csv"
  results_path: "results/results_{species}_{model}.jsonl"

report:
  out_dir: "reports"

# Сравнительный CNN-сервис (владельца приложения-распознавателя пород собак)
cnn:
  enabled: true
  base_url: "https://kreagenium.ru/client/dogs/"
  # endpoint (UrlPoint) и формат запроса определяются скриптом scripts/probe_cnn.py
  endpoint: "classify"
  request_field: "image"      # имя поля JSON с base64 изображения
  timeout: 60
  results_path: "results/results_dog_cnn.jsonl"
