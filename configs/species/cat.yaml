# Кошки: 20 пород (12 из Oxford-IIIT Pet + 8 web-only).
# Пилотные результаты (восстановлены из логов, окружение сбрасывалось):
# closed top-1 62%, open top-1 43%, oxford vs web gap 15.8 п.п.
species: cat
species_rus: "кошка"
is_pet_field: "is_cat"

unrecognized_markers:
  - "беспородная"
  - "домашняя кошка"
  - "дворовая"
  - "метис"
  - "помесь"
  - "не удалось определить"
  - "not a cat"
  - "не кошка"
  - "mixed breed"
  - "domestic shorthair"
  - "domestic longhair"
  - "no cat"

