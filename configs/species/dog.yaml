# Собаки: 20 пород (12 из Oxford-IIIT Pet + 8 web-only с известными "парами-путаницами").
# source: oxford — фото из датасета (модель могла видеть его при обучении);
# source: web — фото собраны из веб-поиска (свежие, вне типичных обучающих наборов).
species: dog
species_rus: "собака"
is_pet_field: "is_dog"

unrecognized_markers:
  - "беспородная"
  - "дворняга"
  - "метис"
  - "помесь"
  - "смешанная порода"
